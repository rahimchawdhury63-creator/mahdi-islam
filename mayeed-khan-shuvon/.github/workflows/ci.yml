# Continuous verification: every push and pull request must typecheck and build,
# and the pre-render step must pass its own content checks (one <h1>, canonical
# URL, JSON-LD graph, 400+ words of indexable text on every route).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Report generated artefact sizes
        run: |
          echo "--- dist/ ---"
          du -sh dist
          ls -la dist | head -30
          printf 'llms-full.txt: %s\n' "$(du -h dist/llms-full.txt | cut -f1)"
          printf 'index.html:    %s\n' "$(du -h dist/index.html | cut -f1)"
